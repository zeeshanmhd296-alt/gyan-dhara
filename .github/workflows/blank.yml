name: Build Gyan Dhara AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Fix Java 17 and Kotlin 17
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Remove any previous JVM fix that may have been appended
          marker = "\n// Force Java and Kotlin compilation to JVM 17"
          if marker in s:
              s = s.split(marker)[0].rstrip() + "\n"

          # Add Android Java 17 compile options
          if 'compileOptions {' not in s:
              s = s.replace(
                  'targetSdk = 35',
                  '''targetSdk = 35

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }'''
              )

          # Add Kotlin JVM 17 configuration
          s += '''

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''

          p.write_text(s)
          PY

          echo "===== FINAL build.gradle.kts ====="
          cat app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AAB
        working-directory: project
        run: |
          gradle clean bundleRelease --no-daemon

      - name: Show AAB
        run: |
          echo "===== AAB FILES ====="
          find project -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gyan-dhara-aab
          path: project/**/build/outputs/bundle/release/*.aab
