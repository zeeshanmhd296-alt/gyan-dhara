name: Build Gyan Dhara AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

            - name: Force Java 17 and Kotlin 17
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Replace all Java 8 targets with Java 17
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace("JavaVersion.VERSION_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")

          # Force Android Java compilation to Java 17
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          # Force Kotlin compilation to JVM 17
          if "jvmTarget = \"17\"" not in s:
              s += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)

          print("===== FINAL build.gradle.kts =====")
          print(s)
          PY
          
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = "    targetSdk = 35\n"

          fix = """    targetSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(marker, fix)

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AAB
        working-directory: project
        run: gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gyan-dhara-aab
          path: project/**/build/outputs/bundle/release/*.aab
