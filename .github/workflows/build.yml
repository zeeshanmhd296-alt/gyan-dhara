name: Build Gyan Dhara AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Fix Java 17 and Kotlin 17
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = "\n// Force Java and Kotlin compilation to JVM 17"
          if marker in s:
              s = s.split(marker)[0].rstrip() + "\n"

          if 'compileOptions {' not in s:
              s = s.replace(
                  'targetSdk = 36',
                  '''targetSdk = 36

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }'''
              )

          s += '''

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''

          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create release keystore
        working-directory: project
        run: |
          keytool -genkeypair \
            -alias gyan-dhara-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore gyan-dhara-upload.jks \
            -storepass GyanDhara2026 \
            -keypass GyanDhara2026 \
            -dname "CN=Gyan Dhara, OU=Gyan Dhara, O=Gyan Dhara, L=India, ST=India, C=IN"

      - name: Configure release signing
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          start = s.find("signingConfigs {")
          end = s.find("\n    }\n\n    buildTypes", start)

          if start != -1 and end != -1:
              replacement = '''signingConfigs {
              create("release") {
                  storeFile = file("../gyan-dhara-upload.jks")
                  storePassword = "GyanDhara2026"
                  keyAlias = "gyan-dhara-upload"
                  keyPassword = "GyanDhara2026"
              }
          }'''
              s = s[:start] + replacement + s[end + len("\n    }"):]

          p.write_text(s)
          PY

          echo "===== SIGNING CONFIG ====="
          grep -A8 "signingConfigs" app/build.gradle.kts

      - name: Build AAB
        working-directory: project
        run: |
          gradle clean bundleRelease --no-daemon

      - name: Show AAB
        run: |
          echo "===== AAB FILES ====="
          find project -type f -name "*.aab" -print

      - name: Upload AAB and keystore
        uses: actions/upload-artifact@v4
        with:
          name: gyan-dhara-release
          path: |
            project/**/build/outputs/bundle/release/*.aab
            project/gyan-dhara-upload.jks
