name: Build Gyan Dhara AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -40

      - name: Force Java 17 and Kotlin 17
        working-directory: project
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          // Force Java and Kotlin compilation to JVM 17
          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
              options.release.set(17)
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "===== JVM FIX ADDED ====="
          tail -30 app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AAB
        working-directory: project
        run: |
          gradle clean bundleRelease --no-daemon

      - name: Show AAB
        run: |
          echo "===== AAB FILES ====="
          find project -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gyan-dhara-aab
          path: project/**/build/outputs/bundle/release/*.aab
