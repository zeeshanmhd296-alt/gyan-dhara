name: Build Gyan Dhara AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Download project
      # --------------------------------------------------
      - name: Download project
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find and extract project ZIP
      # --------------------------------------------------
      - name: Find and extract project ZIP
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."

      # --------------------------------------------------
      # 3. Set up Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Set up Gradle 8.9
      # --------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # --------------------------------------------------
      # 5. Set up Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 6. Install Android SDK 36
      # --------------------------------------------------
      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # --------------------------------------------------
      # 7. Accept Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------------------------
      # 8. Restore release keystore from GitHub Secrets
      # --------------------------------------------------
      - name: Restore release keystore
        working-directory: project
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > gyan-dhara-upload.jks

          if [ ! -s gyan-dhara-upload.jks ]; then
            echo "ERROR: Keystore file was not restored."
            exit 1
          fi

          echo "Keystore restored successfully."

          echo "STORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS_VAL=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. Check project structure
      # --------------------------------------------------
      - name: Check project structure
        run: |
          echo "===== PROJECT FILES ====="
          find project -maxdepth 3 -type f \
            \( -name "settings.gradle*" \
            -o -name "build.gradle*" \
            -o -name "gradlew" \
            -o -name "AndroidManifest.xml" \) \
            -print

      # --------------------------------------------------
      # 10. Build Release AAB
      # --------------------------------------------------
      - name: Build Release AAB
        working-directory: project
        env:
          KEYSTORE_PATH: gyan-dhara-upload.jks
          KEYSTORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_ALIAS: ${{ env.KEY_ALIAS_VAL }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          set -e

          echo "Starting release build..."

          gradle clean bundleRelease --no-daemon

          echo "AAB build completed."

      # --------------------------------------------------
      # 11. Show generated AAB
      # --------------------------------------------------
      - name: Show AAB
        run: |
          echo "===== GENERATED AAB FILES ====="

          find project -type f -name "*.aab" -print

          echo "===== AAB SIZE ====="

          find project -type f -name "*.aab" -exec ls -lh {} \;

      # --------------------------------------------------
      # 12. Confirm SDK configuration
      # --------------------------------------------------
      - name: Confirm SDK versions
        run: |
          echo "===== SDK CONFIGURATION ====="

          grep -R -E \
            "compileSdk|targetSdk|minSdk" \
            project/app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      # --------------------------------------------------
      # 13. Upload AAB as GitHub Artifact
      # --------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gyan-dhara-release-aab
          path: project/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
